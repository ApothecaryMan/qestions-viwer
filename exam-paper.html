<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>مصمم ورقة امتحان</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <nav class="tab-bar" aria-label="تبويبات الصفحات">
    <div class="tab-actions">
      <button class="menu-button" id="toggle-tools" type="button" title="فتح القائمة" aria-label="فتح القائمة"
        aria-expanded="false">☰</button>
      <button class="add-tab" id="add-tab" type="button" title="إضافة صفحة جديدة">+</button>
    </div>
    <div class="tab-list" id="tab-list"></div>
  </nav>

  <div class="app-shell">
    <aside class="designer-panel" aria-label="لوحة تصميم الصفحة">
      <header class="designer-header">
        <p class="eyebrow">A4 PAGE DESIGNER</p>
        <h1>مصمم ورقة الامتحان</h1>
      </header>

      <div class="designer-actions">
        <button class="primary" id="add-question" type="button">+ سؤال</button>
        <button class="primary" id="add-part" type="button">+ قسم جديد</button>
        <button id="print-paper" type="button">طباعة</button>
        <button id="download-paper" type="button">تحميل HTML</button>
        <button id="reset-paper" type="button">إرجاع الافتراضي</button>
        <button id="clear-paper" type="button">مسح الأسئلة</button>
      </div>

      <input id="import-json-input" type="file" accept=".json,application/json" hidden />

      <div class="json-actions" aria-label="خيارات JSON">
        <button id="save-questions" type="button">حفظ الأسئلة</button>
        <button id="download-json" type="button">تحميل JSON</button>
        <button id="edit-json" type="button">تعديل JSON</button>
        <button id="import-json" type="button">رفع JSON</button>
        <button id="copy-ai-template" type="button" title="Copy an AI-ready JSON template">نسخ قالب AI</button>
      </div>

      <label class="field">
        عنوان اختياري للورقة
        <input id="paper-title" type="text" placeholder="مثال: Mathematics Exam" />
      </label>

      <div class="editor-toolbar" aria-label="أدوات البحث داخل الأسئلة">
        <input id="question-search" type="search" placeholder="ابحث برقم السؤال أو النص أو القسم" />
        <select id="question-type-filter">
          <option value="all">كل الأنواع</option>
          <option value="open">إجابة مفتوحة</option>
          <option value="mcq">MCQ</option>
        </select>
        <select class="part-filter" id="question-part-filter">
          <option value="all">كل الأقسام</option>
        </select>
      </div>

      <div class="editor-list-status">
        <span id="editor-count"></span>
        <span>
          <button id="expand-all" type="button">فتح الكل</button>
          <button id="collapse-all" type="button">إغلاق الكل</button>
        </span>
      </div>

      <div class="editor-list" id="editor-list"></div>

      <small class="help-text">
        اكتب المعادلات بين <b>\(...\)</b> أو <b>$$...$$</b>، وسيتم تحويلها تلقائياً بواسطة KaTeX.
      </small>
    </aside>

    <section class="preview-stage" aria-label="المعاينة">
      <div class="preview-label">Live A4 preview — اضغط مرتين على أي نص لتعديله مباشرة</div>
      <div class="theme-carousel" aria-label="اختيار Theme للورقة">
        <button class="theme-carousel-arrow" id="theme-prev" type="button" title="الثيم السابق">‹</button>
        <div class="theme-viewport" id="theme-viewport">
          <div class="theme-list" id="theme-list"></div>
        </div>
        <button class="theme-carousel-arrow" id="theme-next" type="button" title="الثيم التالي">›</button>
      </div>
      <nav class="section-nav" id="section-nav" aria-label="التنقل بين الأقسام"></nav>
      <main class="paper" id="paper" aria-label="Mathematics exam paper"></main>
    </section>
  </div>

  <div class="json-modal" id="json-modal" hidden>
    <section class="json-modal-card" role="dialog" aria-modal="true" aria-labelledby="json-modal-title">
      <h2 id="json-modal-title">تعديل JSON للتاب الحالي</h2>
      <p>عدّل البيانات ثم اضغط تطبيق. يجب أن يحتوي الملف على <code>questions</code> أو يكون Array من الأسئلة.</p>
      <textarea id="json-editor" spellcheck="false"></textarea>
      <div class="json-modal-actions">
        <button class="primary" id="apply-json" type="button">تطبيق التعديلات</button>
        <button id="close-json" type="button">إلغاء</button>
      </div>
    </section>
  </div>
